---
layout: default
---
<article class="post container">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      {% if page.categories %}
      <span class="post-categories">
        {% for cat in page.categories %}<span>{{ cat }}</span>{% endfor %}
      </span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.excerpt %}<p class="post-excerpt">{{ page.excerpt }}</p>{% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/blog' | relative_url }}" class="btn-outline">&larr; Retour au blog</a>
  </footer>
</article>
